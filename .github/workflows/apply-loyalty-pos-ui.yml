name: Apply POS Loyalty Redemption UI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-pos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch POS loyalty redemption UI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/pos/POSScreen.jsx')
          s = p.read_text()

          old = """  const [showQRModal, setShowQRModal] = useState(false);\n  const [showSplitModal, setShowSplitModal] = useState(false);\n"""
          new = """  const [showQRModal, setShowQRModal] = useState(false);\n  const [showSplitModal, setShowSplitModal] = useState(false);\n  const [loyaltyWallet, setLoyaltyWallet] = useState({ points: 0, pointsValue: 0, rupeesPerPoint: 0 });\n  const [loyaltyRedeemPoints, setLoyaltyRedeemPoints] = useState('');\n  const [loyaltyRedeemLoading, setLoyaltyRedeemLoading] = useState(false);\n"""
          if old in s:
              s = s.replace(old, new, 1)

          old = """  const [couponLoading, setCouponLoading] = useState(false);\n\n  // ── dashboard stats ────────────────────────────────────────────\n"""
          new = """  const [couponLoading, setCouponLoading] = useState(false);\n\n  // Refresh the customer's loyalty wallet when the bill/payment screen opens.\n  useEffect(() => {\n    const mobile = activeSession?.customerMobile || phone;\n    if (screen !== 'invoice' || !mobile || String(mobile).replace(/\\D/g, '').length < 10) return;\n    let cancelled = false;\n    api.get(`/loyalty/wallet?phone=${mobile}`).then(r => {\n      if (cancelled) return;\n      const d = r.data || {};\n      setLoyaltyWallet({\n        points: Number(d.points || 0),\n        pointsValue: Number(d.pointsValue || 0),\n        rupeesPerPoint: Number(d.setting?.rupeesPerPoint || 0),\n      });\n    }).catch(() => {});\n    return () => { cancelled = true; };\n  }, [screen, activeSession?.customerMobile, phone]);\n\n  // ── dashboard stats ────────────────────────────────────────────\n"""
          if old in s:
              s = s.replace(old, new, 1)

          marker = """  const recordInvoicePayment = async () => {\n"""
          handler = r'''  const redeemLoyaltyPoints = async () => {
    if (!activeSession?.customerId) {
      toast.error('A registered customer is required to redeem loyalty points');
      return;
    }
    const requested = Math.floor(Number(loyaltyRedeemPoints || 0));
    const total = Number(activeSession.totalAmount || billGrandTotal || 0);
    const paid = Number(activeSession.paidAmount || 0);
    const remaining = Math.max(0, +(total - paid).toFixed(2));
    const rate = Number(loyaltyWallet.rupeesPerPoint || 0);
    const maxByBill = rate > 0 ? Math.floor(remaining / rate + 1e-9) : 0;
    const maxPoints = Math.min(Number(loyaltyWallet.points || 0), maxByBill);

    if (!requested || requested < 1) {
      toast.error('Enter the number of loyalty points to redeem');
      return;
    }
    if (!rate || maxPoints < 1) {
      toast.error('No usable loyalty points are available for this bill');
      return;
    }
    if (requested > maxPoints) {
      toast.error(`Maximum redeemable points: ${maxPoints}`);
      setLoyaltyRedeemPoints(String(maxPoints));
      return;
    }

    setLoyaltyRedeemLoading(true);
    try {
      const r = await api.post(`/loyalty/sessions/${activeSession._id}/redeem`, { points: requested });
      const updated = r.data.session || activeSession;
      const newRemaining = Number(r.data.balance ?? Math.max(0, Number(updated.totalAmount || total) - Number(updated.paidAmount || 0)));
      setActiveSession(updated);
      setInvoice(r.data.invoice || invoice || null);
      setRunningInvoice(r.data.invoice || runningInvoice || null);
      setLoyaltyRedeemPoints('');
      setLoyaltyWallet(prev => ({
        ...prev,
        points: Number(r.data.session?.customerId?.total_points ?? Math.max(0, prev.points - Number(r.data.appliedPoints || requested))),
        pointsValue: Math.max(0, Number(prev.pointsValue) - Number(r.data.redemptionValue || 0)),
      }));
      setReceivedAmt(newRemaining > 0 ? newRemaining.toFixed(2) : '');
      setPaymentRef('');

      if (updated.paymentStatus === 'fully_paid' || updated.status === 'paid') {
        toast.success(`${r.data.appliedPoints || requested} loyalty points redeemed. Bill fully settled.`);
        loadStats();
        loadTables();
        setTimeout(() => { resetFlow(); setScreen('dashboard'); }, 250);
      } else {
        toast.success(`${r.data.appliedPoints || requested} points redeemed · ${fmt(r.data.redemptionValue || 0)} applied`);
      }
    } catch (e) {
      toast.error(e.response?.data?.message || 'Loyalty redemption failed');
    } finally {
      setLoyaltyRedeemLoading(false);
    }
  };

'''
          if marker in s and "const redeemLoyaltyPoints = async () =>" not in s:
              s = s.replace(marker, handler + marker, 1)

          old = """                  if (m.includes('split')) return 'Split Paid:';\n                  return 'Cash Paid:';\n"""
          new = """                  if (m.includes('split')) return 'Split Paid:';\n                  if (m.includes('loyalty')) return 'Loyalty Points Paid:';\n                  return 'Cash Paid:';\n"""
          if old in s:
              s = s.replace(old, new, 1)

          marker = """            <div className=\"grid grid-cols-4 gap-1.5\">\n              {[\n                { id: 'Cash', icon: <IndianRupee size={14} />, label: 'Cash' },\n"""
          loyalty_ui = r'''            {activeSession?.customerId && loyaltyWallet.points > 0 && (
              <div className="rounded-xl border border-amber-500/30 bg-amber-500/10 p-3 space-y-2">
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" checked={loyaltyRedeemPoints !== ''} onChange={e => {
                    if (!e.target.checked) setLoyaltyRedeemPoints('');
                    else setLoyaltyRedeemPoints('');
                  }} className="h-4 w-4 accent-amber-500" />
                  <span className="text-amber-300 font-bold text-sm">Use Loyalty Points</span>
                  <span className="text-[10px] text-amber-200/70 ml-auto">Available: {loyaltyWallet.points} pts · {fmt(loyaltyWallet.pointsValue)}</span>
                </label>
                {loyaltyRedeemPoints !== '' && (
                  <div className="space-y-2">
                    <div className="flex gap-2">
                      <input type="number" min="1" step="1" value={loyaltyRedeemPoints}
                        onChange={e => setLoyaltyRedeemPoints(e.target.value.replace(/\D/g, ''))}
                        placeholder="Points to redeem"
                        className="flex-1 bg-[#171717] border border-amber-500/30 rounded-xl px-3 py-2.5 text-sm text-white font-bold outline-none" />
                      <button type="button" onClick={redeemLoyaltyPoints} disabled={loyaltyRedeemLoading}
                        className="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 disabled:opacity-40 text-black font-black text-xs">
                        {loyaltyRedeemLoading ? 'APPLYING...' : 'APPLY POINTS'}
                      </button>
                    </div>
                    <div className="text-[10px] text-gray-400">Redemption value: {fmt(Number(loyaltyRedeemPoints || 0) * Number(loyaltyWallet.rupeesPerPoint || 0))} · Maximum: {Math.min(loyaltyWallet.points, Number(loyaltyWallet.rupeesPerPoint) > 0 ? Math.floor(Math.max(0, Number(activeSession?.totalAmount || billGrandTotal || 0) - Number(activeSession?.paidAmount || 0)) / Number(loyaltyWallet.rupeesPerPoint)) : 0)} pts</div>
                  </div>
                )}
              </div>
            )}

'''
          if marker in s and "Use Loyalty Points" not in s:
              s = s.replace(marker, loyalty_ui + marker, 1)

          p.write_text(s)
          PY

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Commit POS changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/pos/POSScreen.jsx
          if git diff --cached --quiet; then
            echo "No POS changes required"
            exit 0
          fi
          git commit -m "feat: add loyalty points redemption controls to POS"
          git push
